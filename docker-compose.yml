version: '3.8'

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: winter_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
      PGDATA: /data/postgres
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data: